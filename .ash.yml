# ASH (automated-security-helper) 設定 — squat 共通スターター
# ティアによって global_settings.severity_threshold が変わる（strict=LOW / standard=HIGH / light=CRITICAL）。
# 誤検知が出た場合は suppressions に「理由コメント付き」で追加する（kawasemi 運用と同じ）。
project_name: "idea-cloud"

global_settings:
  severity_threshold: "LOW"
  ignore_paths:
    - path: node_modules/**
      reason: インストール済み依存のため
    - path: .wrangler/**
      reason: wrangler のローカルビルド・状態ディレクトリのため
    - path: dist/**
      reason: ビルド成果物のため
    - path: build/**
      reason: ビルド成果物のため
    - path: .react-router/**
      reason: react-router のビルドキャッシュのため
    - path: pnpm-lock.yaml
      reason: lockfile のハッシュ値が secret 検出で false positive になるため
    - path: .ash/**
      reason: ASH 自身のレポート出力のため
    - path: worker-configuration.d.ts
      reason: wrangler types が生成する型定義ファイルのため
    - path: .claude/skills/**
      reason: rulesync が展開する外部スキルのため
    - path: .agents/skills/**
      reason: rulesync が展開する外部スキルのため
    - path: .codex/skills/**
      reason: rulesync が展開する外部スキルのため
    - path: .junie/skills/**
      reason: rulesync が展開する外部スキルのため
    - path: migrations/meta/**
      reason: drizzle-kit が生成するマイグレーションメタデータ（JSON）のため
  suppressions:
    - path: docs/spec/deploy-and-access.md
      rule_id: SECRET-Secret-Keyword
      reason: Lists GitHub and wrangler secret names only. No secret values are committed.
    - path: wrangler.vitest.jsonc
      rule_id: SECRET-Secret-Keyword
      reason: Vitest fixture MCP_API_KEY is a local test value, not a production credential.
    - path: server/auth/session.ts
      rule_id: SECRET-Secret-Keyword
      reason: Localhost-only HMAC signing key used when SESSION_SECRET is unset. Production never falls back to this value.
    - path: test/premium.test.ts
      rule_id: SECRET-Secret-Keyword
      reason: Stripe webhook fixtures — the vitest `whsec_test` value and a deliberately wrong secret used to assert that a forged signature is rejected. Neither is a real credential.
    - path: db/workspaces.ts
      rule_id: SECRET-Secret-Keyword
      reason: API_KEY_PREFIX is the literal "icw_" that workspace MCP keys start with, so a bearer can be routed to the key table. Keys are random per workspace and stored as SHA-256; no credential value is committed.
    - path: mobile/.metadata
      rule_id: SECRET-Hex-High-Entropy-String
      reason: Flutter writes the SDK git revision here. A commit SHA, not a credential.
    - path: mobile/ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
      rule_id: SECRET-Hex-High-Entropy-String
      reason: Xcode BlueprintIdentifier values generated by `flutter create`. Object ids within the project file, not credentials.
