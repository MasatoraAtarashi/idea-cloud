  <text x="1100" y="164" font-size="11" fill="#6B7280" font-weight="500">経過</text>
  <line x1="504" y1="176" x2="1240" y2="176" stroke="#E5E7EB"/>
  <text x="872" y="360" font-size="14" fill="#111827" font-weight="500" text-anchor="middle">アイデアはまだありません</text>
  <text x="872" y="384" font-size="13" fill="#6B7280" text-anchor="middle">キャプチャから着想を置くと、ここに並びます。</text>
