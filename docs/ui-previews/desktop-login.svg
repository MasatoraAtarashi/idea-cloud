<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, IBM Plex Sans JP, sans-serif">
  <rect width="1280" height="800" fill="#f7f8fb"/>
  <rect x="420" y="170" width="440" height="420" rx="8" fill="#ffffff" stroke="#dcddeb"/>
  <text x="640" y="230" font-size="18" fill="#1a1f2e" font-weight="600" text-anchor="middle">アイデアクラウド</text>
  <text x="640" y="290" font-size="22" fill="#1a1f2e" font-weight="500" text-anchor="middle">ログイン</text>
  <text x="640" y="320" font-size="13" fill="#667085" text-anchor="middle">Google アカウントで続行します</text>
  <rect x="468" y="350" width="344" height="40" rx="4" fill="#ffffff" stroke="#747775"/>
  <circle cx="520" cy="370" r="8" fill="#4285F4"/>
  <text x="640" y="375" font-size="13" fill="#1f1f1f" font-weight="500" text-anchor="middle">Google でログイン</text>
  <text x="640" y="430" font-size="11" fill="#667085" text-anchor="middle">画面確認用。本番はアプリ内 Google OAuth。</text>
  <text x="490" y="520" font-size="12" fill="#667085">トップに戻る</text>
  <text x="700" y="520" font-size="12" fill="#1a1f2e">ログインせず画面を見る</text>
</svg>
