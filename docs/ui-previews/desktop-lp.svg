<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Inter, IBM Plex Sans JP, sans-serif">
  <rect width="1280" height="640" fill="#f7f8fb"/>
  <rect x="0" y="0" width="1280" height="48" rx="8" fill="#ffffff" stroke="#dcddeb"/>
  <text x="48" y="30" font-size="14" fill="#1a1f2e" font-weight="600" text-anchor="start">アイデアクラウド</text>
  <text x="1080" y="30" font-size="12" fill="#667085" font-weight="400" text-anchor="start">画面マップ</text>
  <text x="1160" y="30" font-size="12" fill="#1a1f2e" font-weight="400" text-anchor="start">ログイン</text>
  <rect x="1210" y="12" width="54" height="24" rx="6" fill="#1c2434" stroke="none"/>
  <text x="1237.0" y="28.0" font-size="12" fill="#fff" font-weight="500" text-anchor="middle">はじめる</text>
  <text x="48" y="120" font-size="11" fill="#667085" font-weight="500" text-anchor="start">IDEA CLOUD</text>
  <text x="48" y="170" font-size="36" fill="#1a1f2e" font-weight="600" text-anchor="start">アイデアは、寝かせて熟す。</text>
  <text x="48" y="210" font-size="14" fill="#667085" font-weight="400" text-anchor="start">外山滋比古『思考の整理学』に着想した、チームのためのワークスペース。</text>
  <rect x="48" y="240" width="150" height="36" rx="6" fill="#1c2434" stroke="none"/>
  <text x="123.0" y="262.0" font-size="12" fill="#fff" font-weight="500" text-anchor="middle">はじめる（画面を見る）</text>
  <rect x="210" y="240" width="90" height="36" rx="6" fill="#ffffff" stroke="#dcddeb"/>
  <text x="255.0" y="262.0" font-size="12" fill="#1a1f2e" font-weight="500" text-anchor="middle">ログイン</text>
  <rect x="0" y="310" width="1280" height="140" rx="0" fill="#f2f4f8" stroke="none"/>
  <text x="48" y="360" font-size="14" fill="#1a1f2e" font-weight="600" text-anchor="start">1. つかまえる</text>
  <text x="48" y="386" font-size="13" fill="#667085" font-weight="400" text-anchor="start">モバイルで、整理せず置く。</text>
  <text x="358" y="360" font-size="14" fill="#1a1f2e" font-weight="600" text-anchor="start">2. 寝かせる</text>
  <text x="358" y="386" font-size="13" fill="#667085" font-weight="400" text-anchor="start">熟成レーンに入れ、触れない。</text>
  <text x="668" y="360" font-size="14" fill="#1a1f2e" font-weight="600" text-anchor="start">3. 見返す</text>
  <text x="668" y="386" font-size="13" fill="#667085" font-weight="400" text-anchor="start">熟したものだけレビューする。</text>
  <text x="978" y="360" font-size="14" fill="#1a1f2e" font-weight="600" text-anchor="start">4. 進化させる</text>
  <text x="978" y="386" font-size="13" fill="#667085" font-weight="400" text-anchor="start">融合し、選ばれたら調べる。</text>
  <text x="48" y="490" font-size="18" fill="#1a1f2e" font-weight="600" text-anchor="start">熟成の段階</text>
  <rect x="48" y="520" width="220" height="72" rx="8" fill="#ffffff" stroke="#dcddeb"/>
  <text x="64" y="548" font-size="10" fill="#667085" font-weight="400" text-anchor="start">01</text>
  <text x="64" y="572" font-size="14" fill="#1a1f2e" font-weight="500" text-anchor="start">着想</text>
  <rect x="288" y="520" width="220" height="72" rx="8" fill="#ffffff" stroke="#dcddeb"/>
  <text x="304" y="548" font-size="10" fill="#667085" font-weight="400" text-anchor="start">02</text>
  <text x="304" y="572" font-size="14" fill="#1a1f2e" font-weight="500" text-anchor="start">熟成中</text>
  <rect x="528" y="520" width="220" height="72" rx="8" fill="#ffffff" stroke="#dcddeb"/>
  <text x="544" y="548" font-size="10" fill="#667085" font-weight="400" text-anchor="start">03</text>
  <text x="544" y="572" font-size="14" fill="#1a1f2e" font-weight="500" text-anchor="start">熟した</text>
  <rect x="768" y="520" width="220" height="72" rx="8" fill="#ffffff" stroke="#dcddeb"/>
  <text x="784" y="548" font-size="10" fill="#667085" font-weight="400" text-anchor="start">04</text>
  <text x="784" y="572" font-size="14" fill="#1a1f2e" font-weight="500" text-anchor="start">採用</text>
  <rect x="1008" y="520" width="220" height="72" rx="8" fill="#ffffff" stroke="#dcddeb"/>
  <text x="1024" y="548" font-size="10" fill="#667085" font-weight="400" text-anchor="start">05</text>
  <text x="1024" y="572" font-size="14" fill="#1a1f2e" font-weight="500" text-anchor="start">アーカイブ</text>
</svg>
