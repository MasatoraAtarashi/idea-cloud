<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Inter, IBM Plex Sans JP, sans-serif">
  <rect width="1280" height="640" fill="#f7f8fb"/>
  <rect x="0" y="0" width="1280" height="28" rx="0" fill="#f2f4f8" stroke="#dcddeb"/>
  <text x="640" y="18" font-size="11" fill="#667085" font-weight="400" text-anchor="middle">画面認識用の静的モックです。保存・認証・AI はまだ動きません。</text>
  <rect x="0" y="28" width="224" height="612" rx="0" fill="#ffffff" stroke="#dcddeb"/>
  <text x="24" y="64" font-size="14" fill="#1a1f2e" font-weight="600" text-anchor="start">アイデアクラウド</text>
  <text x="28" y="80" font-size="13" fill="#667085" font-weight="400" text-anchor="start">キャプチャ</text>
  <text x="28" y="112" font-size="13" fill="#667085" font-weight="400" text-anchor="start">熟成ボード</text>
  <text x="28" y="144" font-size="13" fill="#667085" font-weight="400" text-anchor="start">融合</text>
  <rect x="12" y="158" width="200" height="32" rx="6" fill="#f2f4f8" stroke="none"/>
  <rect x="12" y="162" width="3" height="24" rx="2" fill="#1c2434" stroke="none"/>
  <text x="28" y="176" font-size="13" fill="#1a1f2e" font-weight="500" text-anchor="start">リサーチ</text>
  <text x="28" y="208" font-size="13" fill="#667085" font-weight="400" text-anchor="start">チーム</text>
  <text x="24" y="620" font-size="10" fill="#667085" font-weight="400" text-anchor="start">LiteLLM 型のライトコンソール</text>
  <rect x="224" y="28" width="1056" height="44" rx="0" fill="#f7f8fb" stroke="#dcddeb"/>
  <text x="248" y="56" font-size="12" fill="#667085" font-weight="400" text-anchor="start">Atarashi Lab · モックセッション</text>
  <text x="1180" y="56" font-size="12" fill="#667085" font-weight="400" text-anchor="start">ログイン（スタブ）</text>
  <text x="248" y="110" font-size="22" fill="#1a1f2e" font-weight="600" text-anchor="start">リサーチ / プロトタイプ</text>
  <text x="248" y="136" font-size="13" fill="#667085" font-weight="400" text-anchor="start">選ばれたアイデアにだけ、調べる権利がある。</text>
  <rect x="248" y="170" width="520" height="36" rx="8" fill="#ffffff" stroke="#dcddeb"/>
  <text x="264" y="194" font-size="13" fill="#1a1f2e" font-weight="400" text-anchor="start">採用したアイデアだけリサーチする</text>
  <rect x="248" y="230" width="760" height="220" rx="8" fill="#ffffff" stroke="#dcddeb"/>
  <text x="264" y="270" font-size="13" fill="#1a1f2e" font-weight="400" text-anchor="start">熟成前に調査すると、忘れる時間が消える。</text>
  <text x="264" y="298" font-size="13" fill="#1a1f2e" font-weight="400" text-anchor="start">競合メモアプリはキャプチャが強いが、寝かせるUIを持たない。</text>
</svg>
