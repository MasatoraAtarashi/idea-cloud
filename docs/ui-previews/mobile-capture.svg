<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Inter, IBM Plex Sans JP, sans-serif">
  <rect width="390" height="844" fill="#ffffff"/>
  <text x="16" y="36" font-size="18" fill="#111827" font-weight="600">キャプチャ</text>
  <text x="16" y="58" font-size="12" fill="#6B7280">分類もタグも後回し。一文で置いて、忘れる。</text>
  <text x="16" y="92" font-size="11" fill="#6B7280">いまの着想</text>
  <rect x="16" y="104" width="358" height="160" rx="6" fill="#ffffff" stroke="#E5E7EB"/>
  <text x="28" y="136" font-size="13" fill="#9CA3AF">歩きながら浮かんだことを、そのまま。</text>
  <rect x="16" y="284" width="140" height="36" rx="6" fill="#1F2937"/>
  <text x="86" y="307" font-size="13" fill="#ffffff" font-weight="500" text-anchor="middle">置いて寝かせる</text>
  <rect x="0" y="780" width="390" height="64" fill="#ffffff" stroke="#E5E7EB"/>
  <text x="39" y="818" font-size="11" fill="#111827" font-weight="500" text-anchor="middle">取る</text>
  <text x="117" y="818" font-size="11" fill="#6B7280" text-anchor="middle">一覧</text>
  <text x="195" y="818" font-size="11" fill="#6B7280" text-anchor="middle">融合</text>
  <text x="273" y="818" font-size="11" fill="#6B7280" text-anchor="middle">研究</text>
  <text x="351" y="818" font-size="11" fill="#6B7280" text-anchor="middle">設定</text>
</svg>
