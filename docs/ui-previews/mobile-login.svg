<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Inter, IBM Plex Sans JP, sans-serif">
  <rect width="390" height="844" fill="#f7f8fb"/>
  <rect x="24" y="210" width="342" height="400" rx="8" fill="#ffffff" stroke="#dcddeb"/>
  <text x="195" y="270" font-size="18" fill="#1a1f2e" font-weight="600" text-anchor="middle">アイデアクラウド</text>
  <text x="195" y="330" font-size="22" fill="#1a1f2e" font-weight="500" text-anchor="middle">ログイン</text>
  <text x="195" y="360" font-size="13" fill="#667085" text-anchor="middle">Google アカウントで続行します</text>
  <rect x="44" y="390" width="302" height="40" rx="4" fill="#ffffff" stroke="#747775"/>
