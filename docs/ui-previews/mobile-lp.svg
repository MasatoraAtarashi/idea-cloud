<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Inter, IBM Plex Sans JP, sans-serif">
  <rect width="390" height="844" fill="#f7f8fb"/>
  <rect x="0" y="0" width="390" height="52" rx="8" fill="#ffffff" stroke="#dcddeb"/>
  <text x="16" y="32" font-size="13" fill="#1a1f2e" font-weight="600" text-anchor="start">アイデアクラウド</text>
  <rect x="300" y="14" width="74" height="24" rx="6" fill="#1c2434" stroke="none"/>
  <text x="337.0" y="30.0" font-size="12" fill="#fff" font-weight="500" text-anchor="middle">はじめる</text>
  <text x="16" y="120" font-size="11" fill="#667085" font-weight="500" text-anchor="start">IDEA CLOUD</text>
  <text x="16" y="168" font-size="28" fill="#1a1f2e" font-weight="600" text-anchor="start">アイデアは、</text>
  <text x="16" y="204" font-size="28" fill="#1a1f2e" font-weight="600" text-anchor="start">寝かせて熟す。</text>
  <text x="16" y="244" font-size="13" fill="#667085" font-weight="400" text-anchor="start">思いつきはすぐに捕まえる。その場では磨かない。</text>
  <rect x="16" y="280" width="170" height="36" rx="6" fill="#1c2434" stroke="none"/>
  <text x="101.0" y="302.0" font-size="12" fill="#fff" font-weight="500" text-anchor="middle">はじめる（画面を見る）</text>
  <rect x="196" y="280" width="90" height="36" rx="6" fill="#ffffff" stroke="#dcddeb"/>
  <text x="241.0" y="302.0" font-size="12" fill="#1a1f2e" font-weight="500" text-anchor="middle">ログイン</text>
  <rect x="0" y="360" width="390" height="200" rx="0" fill="#f2f4f8" stroke="none"/>
  <text x="16" y="400" font-size="14" fill="#1a1f2e" font-weight="600" text-anchor="start">1. つかまえる</text>
  <text x="16" y="424" font-size="13" fill="#667085" font-weight="400" text-anchor="start">モバイルで、整理せず置く。</text>
  <text x="16" y="460" font-size="14" fill="#1a1f2e" font-weight="600" text-anchor="start">2. 寝かせる</text>
  <text x="16" y="484" font-size="13" fill="#667085" font-weight="400" text-anchor="start">熟成レーンに入れ、触れない。</text>
</svg>
